name: Build JSTech Privado Android

on:
  push:
    branches:
      - jstech-privado-android-v1.1
    paths:
      - 'android/JSTechPrivado/**'
      - '.github/workflows/android-jstech-privado.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35 packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        working-directory: android/JSTechPrivado
        run: gradle --no-daemon assembleRelease

      - name: Prepare release files
        run: |
          mkdir -p output
          cp android/JSTechPrivado/app/build/outputs/apk/release/app-release-unsigned.apk output/JSTech-Privado-1.3.0-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" output/apksigner.jar
          sha256sum output/JSTech-Privado-1.3.0-unsigned.apk > output/unsigned-sha256.txt

      - name: Upload release build
        uses: actions/upload-artifact@v4
        with:
          name: JSTech-Privado-1.3.0-Unsigned
          path: |
            output/JSTech-Privado-1.3.0-unsigned.apk
            output/apksigner.jar
            output/unsigned-sha256.txt
          retention-days: 30
