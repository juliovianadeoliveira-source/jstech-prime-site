plugins {
    id "com.android.application"
}

android {
    namespace "br.com.jstech.privado"
    compileSdk 35

    defaultConfig {
        applicationId "br.com.jstech.privado"
        minSdk 23
        targetSdk 35
        versionCode 13
        versionName "1.3.2"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
